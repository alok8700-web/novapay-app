apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: {{ .Chart.Name }}-network-policy

spec:
  podSelector:
    matchLabels:
      app: {{ .Chart.Name }}

  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Allow NovaPay traffic from pods in the same namespace.
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.container.port }}

  egress:
    # Allow DNS resolution through CoreDNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
