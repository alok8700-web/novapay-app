name: NovaPay CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: novapay-eks
  IMAGE_NAME: alokdocker8700/novapay

jobs:
  test-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Root Dependencies
        run: npm install

      - name: Install Project Dependencies
        run: npm run install:all

      - name: Run Tests
        run: npm test

      - name: Build Frontend
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -----------------------------
      # AWS / EKS DEPLOYMENT
      # -----------------------------

      - name: Configure AWS Credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::274193347237:role/GitHubActions-NovaPay-EKS
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        if: github.event_name == 'push'
        run: aws sts get-caller-identity

      - name: Update kubeconfig
        if: github.event_name == 'push'
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Verify EKS Access
        if: github.event_name == 'push'
        run: |
          kubectl get nodes

      - name: Deploy NovaPay to EKS
        if: github.event_name == 'push'
        run: |
          kubectl set image deployment/novapay \
            novapay=${IMAGE_NAME}:${GITHUB_SHA}

      - name: Wait for Deployment Rollout
        if: github.event_name == 'push'
        run: |
          kubectl rollout status deployment/novapay --timeout=5m

      - name: Verify Deployment
        if: github.event_name == 'push'
        run: |
          kubectl get deployment novapay
          kubectl get pods -l app=novapay -o wide

      - name: Verify Application Health
        if: github.event_name == 'push'
        run: |
          kubectl get pods -l app=novapay
